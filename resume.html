<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="img/kf-logo.png"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Resume / Kalan Ferguson</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --fog:       #f7f7f7;
  --snow:      #ffffff;
  --carbon:    #000000;
  --midnight:  #181825;
  --stone:     #636363;
  --pebble:    #949494;
  --tangerine: #f69251;
  --shadow-subtle:   rgba(24,24,37,0.12) 0px 2px 3px -2px;
  --shadow-subtle-2: rgba(0,0,0,0.04) 0px 1px 2px 0px,
                     rgba(0,0,0,0.02) 0px 2px 4px 0px,
                     rgba(0,0,0,0.02) 0px 4px 8px 0px;
  --r-btn:   28px;
  --r-nav:   32px;
  --r-badge: 100px;
  --r-card:  24px;
  --font-display: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  --font-body:    'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--fog); color: var(--carbon); font-family: var(--font-body);
       -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { text-decoration: none; }

/* NAV */
.site-header {
  position: sticky; top: 0; z-index: 50;
  padding: 12px 24px;
  pointer-events: none;
}
.nav-inner {
  pointer-events: auto;
  max-width: 1200px; margin: 0 auto;
  background: rgba(255,255,255,0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: var(--r-nav);
  box-shadow: var(--shadow-subtle);
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); font-size: 15px; font-weight: 500;
  color: var(--carbon); letter-spacing: -0.01em;
}
.brand img { width: 34px; height: 34px; border-radius: 50%; }
.nav-links { display: flex; gap: 4px; align-items: center; }
.nav-links a {
  font-size: 14px; font-weight: 500; color: var(--stone);
  padding: 6px 12px; border-radius: var(--r-badge);
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--carbon); }
.nav-cta {
  background: var(--tangerine) !important;
  color: var(--carbon) !important;
  border-radius: var(--r-btn) !important;
  padding: 8px 20px !important;
  box-shadow: var(--shadow-subtle-2);
  transition: opacity 0.2s !important;
}
.nav-cta:hover { opacity: 0.85 !important; }

/* PAGE CONTENT */
.page-header {
  max-width: 900px; margin: 0 auto;
  padding: 56px 32px 32px;
}
.page-header .label {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--pebble); letter-spacing: 0.2em; text-transform: uppercase;
  margin-bottom: 12px;
}
.page-header h1 {
  font-family: var(--font-display); font-size: clamp(28px, 4vw, 44px);
  font-weight: 300; letter-spacing: -0.02em; color: var(--carbon);
  margin-bottom: 8px;
}
.page-header .sub {
  font-size: 15px; color: var(--stone); line-height: 1.6;
}

.resume-wrap {
  max-width: 900px; margin: 0 auto;
  padding: 0 32px 120px;
}
.pdf-card {
  background: var(--snow);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-subtle);
  overflow: hidden;
  margin-bottom: 24px;
}
.pdf-embed {
  width: 100%; height: 80vh;
  border: none; display: block;
}
.resume-actions {
  display: flex; gap: 12px; flex-wrap: wrap;
}
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;
  font-family: var(--font-display); font-size: 14px; font-weight: 500;
  color: var(--carbon); background: var(--tangerine);
  border-radius: var(--r-btn);
  box-shadow: var(--shadow-subtle-2);
  transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 28px;
  font-family: var(--font-display); font-size: 14px; font-weight: 500;
  color: var(--carbon); background: var(--snow);
  border-radius: var(--r-btn);
  box-shadow: var(--shadow-subtle);
  transition: box-shadow 0.2s, transform 0.2s;
}
.btn-ghost:hover { box-shadow: var(--shadow-subtle-2); transform: translateY(-1px); }

@media (max-width: 700px) {
  .nav-links a:not(.nav-cta) { display: none; }
  .pdf-embed { height: 60vh; }
}
::selection { background: var(--tangerine); color: var(--carbon); }
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <a href="index.html" class="brand"><img src="img/kf-logo.png" alt="KF"><span>Kalan Ferguson</span></a>
    <nav class="nav-links">
      <a href="index.html#work">Work</a>
      <a href="index.html#about">About</a>
      <a href="ghostbat.html">Writing</a>
      <a href="resume.html">Resume</a>
      <a href="mailto:kalanferguson005@gmail.com" class="nav-cta">Contact</a>
    </nav>
  </div>
</header>

<div class="page-header">
  <div class="label">Curriculum Vitae</div>
  <h1>Resume</h1>
  <p class="sub">Mechanical Engineering (Honours) / Aerospace Minor / Queensland University of Technology</p>
</div>

<div class="resume-wrap">
  <div class="pdf-card">
    <iframe src="resume.pdf" class="pdf-embed" title="Kalan Ferguson Resume"></iframe>
  </div>
  <div class="resume-actions">
    <a href="resume.pdf" download class="btn-primary">Download PDF</a>
    <a href="index.html" class="btn-ghost">&larr; Back to portfolio</a>
  </div>
</div>

</body>
</html>
